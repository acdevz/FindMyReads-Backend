spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}                     # Railway: jdbc:postgresql://...
    username: ${DB_USER}
    password: ${DB_PASS}
    hikari:
      maximum-pool-size: 3             # Supabase free tier: max 5 connections, leave headroom
      minimum-idle: 1
      idle-timeout: 300000             # release idle connections quickly on free tier
      keepalive-time: 60000            # prevent proxy timeout on Railway/Render

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    baseline-on-migrate: true          # safe for first deploy against Supabase

  # --- Spring AI ---
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash-lite
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            options:
              model: gemini-embedding-001
              dimensions: 768
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 2000
        multiplier: 2
        max-interval: 10000

  # --- Virtual threads (JDK 25 + Boot 3.5 supports this) ---
  threads:
    virtual:
      enabled: true                    # near-reactive throughput, zero reactive complexity

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/google"

jwt:
  secret: ${JWT_SECRET}
  expiry-ms: ${JWT_EXPIRY_MS:86400000}

## --- Google Books ---
google:
  books:
    api-key: ${GOOGLE_BOOKS_API_KEY}

## --- Logging (minimal in prod) ---
logging:
  level:
    root: WARN
    org.fmr: INFO
    org.springframework.security: WARN

app:
  frontend-url: ${FRONTEND_URL}

