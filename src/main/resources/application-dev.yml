spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/findmyreads
    username: fmr_user
    password: fmr_pass
    hikari:
      maximum-pool-size: 5             # local dev doesn't need more

  jpa:
    show-sql: true                     # log queries locally — off in prod
    properties:
      hibernate:
        format_sql: true

  # --- Spring AI — Google GenAI (Gemini) ---
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash-lite
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            options:
              model: gemini-embedding-001
              dimensions: 768
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 2000
        multiplier: 2
        max-interval: 10000

  security:
    oauth2:
      client:
        registration:
            google:
              client-id: ${GOOGLE_OAUTH_CLIENT_ID}
              client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
              scope:
                - openid
                - email
                - profile
              redirect-uri: "{baseUrl}/login/oauth2/code/google"

jwt:
  secret: ${JWT_SECRET}               # export JWT_SECRET=<min-32-char-base64-string>
  expiry-ms: ${JWT_EXPIRY_MS:3600000} # 1 hour default
# --- Google Books ---
#google:
#  books:
#    api-key: ${GOOGLE_BOOKS_API_KEY}  # export GOOGLE_BOOKS_API_KEY=...

# --- Logging (verbose locally) ---
logging:
  level:
    root: INFO
    org.fmr: DEBUG                     # your package — full debug
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE # shows bind parameter values

app:
  frontend-url: http://localhost:5173

google:
  books:
    api-key: ${GOOGLE_BOOKS_API_KEY}