spring:
  application:
    name: FindMyReads
  profiles:
    active: dev # --- for development only! ---

  # --- datasource ---
  datasource:
    hikari:
      connection-timeout: 20000
      max-lifetime: 1800000
      auto-commit: false               # let Spring @Transactional own commits

  # --- JPA ---
  jpa:
    hibernate:
      ddl-auto: validate               # Flyway owns DDL ? Hibernate only validates
    open-in-view: false                # never true ? causes lazy-load surprises
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25               # useful when bulk-inserting scan_books rows
        order_inserts: true
        order_updates: true

  # --- Flyway ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false         # set true only on first run against existing DB


# --- Cache (Caffeine) ---
#  cache:
#    type: caffeine
#    caffeine:
#      spec: maximumSize=500,expireAfterWrite=24h

  # --- Multipart (scan image uploads) ---
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

